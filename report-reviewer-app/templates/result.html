<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Result</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <main class="container wide">
    <section class="card">
      <a href="/" class="back">← Review another report</a>
      <h1>Review for {{ filename }}</h1>
      <pre class="review">{{ review }}</pre>
    </section>
  </main>
</body>
</html>
